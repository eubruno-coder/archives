<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novidades — Central de Atendimento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#0056b3;--escuro:#0c2340;--claro:#e8f1fb;--fundo:#f3f6fa;--borda:#dbe3ec;--texto:#1f2937;--muted:#64748b}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);min-height:100vh}
.top{height:64px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--escuro)}.icon{width:38px;height:38px;border-radius:8px;background:var(--azul);color:#fff;display:grid;place-items:center}.back{color:var(--azul);text-decoration:none;font-size:13px;font-weight:700}.user{font-size:13px;color:var(--muted);font-weight:700;margin-right:18px}
main{max-width:900px;margin:0 auto;padding:36px 22px}.intro{margin-bottom:28px}.intro-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.intro h1{color:var(--escuro);font-size:28px;margin-bottom:6px}.intro p{color:var(--muted);font-size:14px}.badge{background:var(--azul);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}.notice{background:#fff;border:1px solid var(--borda);border-left:4px solid var(--azul);border-radius:9px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.tag{display:inline-block;background:var(--claro);color:var(--azul);font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 8px;border-radius:4px}.date{color:#94a3b8;font-size:11px}.notice h2{font-size:16px;color:#1e3a5f;margin-bottom:6px}.notice p{font-size:13px;line-height:1.55;color:#475569}.empty{text-align:center;background:#fff;border:1px solid var(--borda);border-radius:9px;padding:55px 20px;color:var(--muted)}.empty-icon{font-size:30px;margin-bottom:10px}.empty h2{font-size:16px;color:var(--escuro);margin-bottom:5px}.empty p{font-size:13px}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:20px}
@media(max-width:600px){.top{padding:0 14px}.user{display:none}main{padding:24px 14px}.intro-top{align-items:flex-start;flex-direction:column}.intro h1{font-size:23px}}
</style>
<script src="novidades.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><div class="icon">▦</div>Central de Atendimento</div>
  <div style="display:flex;align-items:center"><span class="user" id="userName"></span><a class="back" href="index.html">← Voltar para a Central</a></div>
</header>
<main>
<section class="intro">
  <div class="intro-top">
    <div><h1>📰 Novidades da Central</h1><p>Confira as atualizações realizadas desde o seu último acesso.</p></div>
    <div class="badge" id="countBadge">0 novidades</div>
  </div>
</section>
<section id="newsList"></section>
</main>
<footer class="footer">Central de Atendimento · Controle local de novidades</footer>
<script>
(function(){
  const usuario=localStorage.getItem(CENTRAL_STORAGE.usuario)||'Usuário';
  document.getElementById('userName').textContent=usuario;

  const novidades=CentralNovidades.listar();
  document.getElementById('countBadge').textContent=`${novidades.length} ${novidades.length===1?'novidade':'novidades'}`;

  const lista=document.getElementById('newsList');
  if(!novidades.length){
    lista.innerHTML='<div class="empty"><div class="empty-icon">✓</div><h2>Você está em dia!</h2><p>Não há novas atualizações desde a sua última visualização.</p></div>';
    return;
  }

  lista.innerHTML=novidades.map(item=>`
    <article class="notice">
      <div class="meta"><span class="tag">${item.tipo}</span><span class="date">${CentralNovidades.formatarData(item.data)}</span></div>
      <h2>${item.titulo}</h2>
      <p>${item.descricao}</p>
    </article>`).join('');

  CentralNovidades.marcarVistas(novidades.map(item=>item.id));
})();
</script>
</body>
</html>
